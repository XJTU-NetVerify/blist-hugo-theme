<div class="flex gap-2 items-center">
  {{ if .Params.image }}
  <img src="{{ .Params.image }}" alt="{{ .Params.title }}" class="m-0 rounded-full shadow-sm h-16 w-16 object-cover" />
  {{ else }}
  <img src="/images/placeholder-avatar.svg" alt="{{ .Params.title }}" class="m-0 rounded-full shadow-sm h-16 w-16 object-cover" />
  {{ end }}
  <div class="flex flex-col">
    <div class="text-lg font-semibold">
      {{ if eq $.Page.Language.Label "English" }}
        {{ .Params.title }}
      {{ else }}
        {{ $title := "@1 (@2)"}}
        {{ $title = replace $title "@1" .Params.title }}
        {{ replace $title "@2" .Params.name_cn }}
      {{ end }}
    </div>

    <div class="text-sm text-gray-500">
      {{ .Params.degree }}
    </div>
    <div class="text-sm font-light italic text-gray-500">
      Now: {{ .Params.work }}
    </div>
  </div>
</div>
