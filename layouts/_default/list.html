{{ define "main" }}

  <h1 class="container max-w-screen-lg px-6 pt-6 mx-auto text-2xl font-semibold">{{ .Title }}</h1>

  {{ $paginator := .Paginate .Pages.ByDate.Reverse 10 }}
  <div class="container max-w-screen-lg px-6 py-4 mx-auto flex flex-col">
    {{ range $paginator.Pages }}
      {{- partial "blog-card.html" . -}}
    {{ end }}
  </div>

  {{- partial "pagination.html" . -}}
  
  <!-- {{- partial "social.html" . -}} -->
{{ end }}
